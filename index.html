<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Loktantra: The Indian Election Simulator</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            saffron: '#ff9933',
            emerald: '#10b981',
            navy: '#1e3a8a',
            slateDark: '#090d16'
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/mobile-shell.css" />
  <link rel="stylesheet" href="css/map-styles.css" />
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-amber-500 selection:text-black">

  <div id="app-shell">
    <!-- PERSISTENT TOP HUD -->
    <header id="top-hud"></header>

    <!-- LIVE BREAKING NEWS TICKER -->
    <div id="live-ticker-bar" class="px-3 flex items-center bg-slate-950/80 border-b border-slate-800/80">
      <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-rose-600 text-[10px] font-black uppercase tracking-wider text-white shrink-0 mr-2">
        <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
        BREAKING
      </div>
      <div class="overflow-hidden w-full relative">
        <div id="ticker-text" class="animate-marquee text-xs text-slate-300 font-mono">
          Election Commission of India issues notification for 543 Lok Sabha seats • Voting in 7 phases • 272 seats needed for majority
        </div>
      </div>
    </div>

    <!-- MAIN RESPONSIVE CONTAINER (Switches to 3-column Command Center on Desktop) -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-2 sm:p-4 md:p-6 overflow-y-auto">
      
      <!-- DESKTOP TOP NAV BAR (Hidden on Mobile) -->
      <div class="hidden lg:flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-xs font-black uppercase tracking-widest text-amber-500">COMMAND CENTER</span>
          <span class="text-xs text-slate-500">|</span>
          <span class="text-xs text-slate-400 font-mono">Lok Sabha General Election Operations</span>
        </div>

        <div id="desktop-tab-nav" class="flex gap-2">
          <!-- Desktop Tab Buttons mirrors mobile items -->
        </div>
      </div>

      <!-- TAB CONTENTS -->
      <div id="tab-pane-map" class="tab-content active"></div>
      <div id="tab-pane-campaign" class="tab-content"></div>
      <div id="tab-pane-finance" class="tab-content"></div>
      <div id="tab-pane-media" class="tab-content"></div>

    </main>

    <!-- MOBILE STICKY BOTTOM NAVIGATION BAR -->
    <nav id="mobile-bottom-nav">
      <button class="nav-item active" data-tab="map">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span>War Room</span>
      </button>

      <button class="nav-item" data-tab="campaign">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
        <span>Campaign</span>
      </button>

      <button class="nav-item" data-tab="finance">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Treasury</span>
      </button>

      <button class="nav-item" data-tab="media">
        <span class="nav-badge" id="media-badge"></span>
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
        <span>Media</span>
      </button>
    </nav>
  </div>

  <!-- MODAL CONTAINERS -->
  <div id="start-screen-modal"></div>
  <div id="election-results-modal"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
